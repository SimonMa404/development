[project]
name = "urban-climate-tool-backend"
version = "0.1.0"
description = "Geospatial climate adaptation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "rasterio>=1.3.10,<2.0.0",
  "rio-tiler>=6.2.0,<7.0.0",
  "geopandas>=0.14.4,<1.0.0",
  "shapely>=2.0.0,<3.0.0",
  "pyproj>=3.6.0,<4.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "requests>=2.31.0,<3.0.0",
  "pyarrow>=16.1.0,<20.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
