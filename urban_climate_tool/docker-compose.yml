services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban-climate-backend
    env_file:
      - .env
    environment:
      DATA_ROOT: /app/storage
      LAYER_CATALOG_PATH: /app/catalog/layers.yaml
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./catalog:/app/catalog:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban-climate-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
