    description: Official municipal boundary of Planegg (Gemeinde), Bavaria, from the BKG VG250 administrative dataset.
    layer_type: vector
    thematic_group: Administrative
    area: planegg
    storage_backend: local
    relative_path: vectors/processed/planegg/boundary.geojson
    data_format: geojson
    source: "BKG VG250 (2026-01-01 release)"
    attribution: "© GeoBasis-DE / BKG"
    native_crs: EPSG:4326
    bounds:
      minx: 11.385189
      miny: 48.078465
      maxx: 11.463442
      maxy: 48.120001
